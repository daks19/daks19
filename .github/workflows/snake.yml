name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate every 12 hours
  workflow_dispatch:           # allow manual trigger from Actions tab
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake (dark + vibrant blue)
        uses: Platane/snk@v3
        with:
          github_user_name: daks19
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff6b6b&color_dots=%230d1117%2C%230d2a4a%2C%231a4a8a%2C%231f6feb%2C%2358a6ff

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
